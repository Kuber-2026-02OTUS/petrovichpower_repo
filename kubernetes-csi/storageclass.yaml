apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: yc-s3-storage-class
provisioner: ru.yandex.s3.csi
parameters:
  mounter: geesefs
  options: "--memory-limit 1000 --clean-dir"
  bucket: otus-hw-bucket-z0iabx3w # Укажи свой бакет
  endpoint: https://storage.yandexcloud.net
  # Ссылки на секрет с ключами:
  csi.storage.k8s.io/provisioner-secret-name: yc-s3-secret
  csi.storage.k8s.io/provisioner-secret-namespace: default
  csi.storage.k8s.io/node-publish-secret-name: yc-s3-secret
  csi.storage.k8s.io/node-publish-secret-namespace: default
volumeBindingMode: Immediate